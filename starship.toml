"$schema" = 'https://starship.rs/config-schema.json'

palette = 'jellybeans'

format = """
$directory\
$nodejs\
$ruby\
$python\
$git_branch\
$git_status\
${custom.pr}\
$line_break\
$character"""

[palettes.jellybeans]
fg           = '#e8e8d3'
bg           = '#151515'
grey         = '#888888'
grey_dark    = '#333333'
gravel       = '#403c41'
red          = '#cf6a4c'
red_bright   = '#d64343'
blue         = '#8fbfdc'
blue_light   = '#8197bf'
purple       = '#c6b6ee'
yellow       = '#fad07a'
green        = '#8bc1aa'
green_bright = '#99ad6a'

[directory]
style = 'bold blue_light'
format = '[$path]($style) '
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = 'bold purple'
symbol = ' '
format = 'on [$symbol$branch]($style) '

[git_status]
style = 'bold red_bright'
format = '([\[$all_status$ahead_behind\]]($style) )'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red_bright)'

[custom.pr]
command = '''bkt --ttl=45s --stale=15s --scope="$(git rev-parse --show-toplevel 2>/dev/null)/$(git branch --show-current 2>/dev/null)" -- /Users/gustavopuglia/code/dotfiles/starship-pr-status.sh'''
when = 'git rev-parse --is-inside-work-tree 2>/dev/null'
format = '[$output]($style) '
style = 'bold'
shell = ['bash', '--noprofile', '--norc']
ignore_timeout = true
description = 'GitHub PR number + CI status link'
