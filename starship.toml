"$schema" = 'https://starship.rs/config-schema.json'

palette = 'jellybeans'

format = """
$directory\
$nodejs\
$ruby\
$python\
$git_branch\
$git_status\
$line_break\
$character"""

[palettes.jellybeans]
fg           = '#e8e8d3'
bg           = '#151515'
grey         = '#888888'
grey_dark    = '#333333'
gravel       = '#403c41'
red          = '#cf6a4c'
red_bright   = '#d64343'
blue         = '#8fbfdc'
blue_light   = '#8197bf'
purple       = '#c6b6ee'
yellow       = '#fad07a'
green        = '#8bc1aa'
green_bright = '#99ad6a'

[directory]
style = 'bold blue_light'
format = '[$path]($style) '
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = 'bold purple'
symbol = ' '
format = 'on [$symbol$branch]($style) '

[git_status]
style = 'bold red_bright'
format = '([\[$all_status$ahead_behind\]]($style) )'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red_bright)'
