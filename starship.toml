"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$nodejs\
$ruby\
$python\
$git_branch\
$git_status\
$line_break\
$character"""

[directory]
style = 'bold cyan'
format = '[$path]($style) '
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = 'bold purple'
symbol = ' '
format = 'on [$symbol$branch]($style) '

[git_status]
style = 'bold red'
format = '([\[$all_status$ahead_behind\]]($style) )'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
