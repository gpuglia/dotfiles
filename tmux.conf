# Ring the bell if any background window rang a bell
set -g bell-action any

set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -g extended-keys always
set -g extended-keys-format csi-u
set -g focus-events on

# Alacritty truecolor support
set -as terminal-features ",alacritty:RGB"
set -as terminal-overrides ",alacritty:Tc"

# Ghostty: truecolor, cursor shape (Ss/Se), OSC 8 hyperlinks, styled underlines
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:ccolour:cstyle:usstyle:title:extkeys"
set -as terminal-features ",alacritty:extkeys"

# Keep your finger on ctrl, or don't
bind-key ^D detach-client

# Create splits and vertical splits
bind-key v split-window -h -l 50% -c "#{pane_current_path}"
bind-key ^V split-window -h -l 50% -c "#{pane_current_path}"
bind-key ^S split-window -l 50% -c "#{pane_current_path}"
bind-key t split-window -h -l 35% -c "#{pane_current_path}"
bind-key S split-window -l 30% -c "#{pane_current_path}"

# Pane resize in all four directions using vi bindings.
# Can use these raw but I map them to shift-ctrl-<h,j,k,l> in iTerm.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5

# Smart pane switching with awareness of vim splits.
# Source: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'if-shell -F "#{pane_at_left}"   "" "select-pane -L"'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'if-shell -F "#{pane_at_bottom}" "" "select-pane -D"'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'if-shell -F "#{pane_at_top}"    "" "select-pane -U"'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'if-shell -F "#{pane_at_right}"  "" "select-pane -R"'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' if-shell -F "#{pane_at_left}"   "" "select-pane -L"
bind-key -T copy-mode-vi 'C-j' if-shell -F "#{pane_at_bottom}" "" "select-pane -D"
bind-key -T copy-mode-vi 'C-k' if-shell -F "#{pane_at_top}"    "" "select-pane -U"
bind-key -T copy-mode-vi 'C-l' if-shell -F "#{pane_at_right}"  "" "select-pane -R"
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Use vi keybindings for tmux commandline input.
# Note that to get command mode you need to hit ESC twice...
set -g status-keys vi

# Use vi keybindings in copy and choice modes
setw -g mode-keys vi

# easily toggle synchronization (mnemonic: e is for echo)
# sends input to all panes in a given window.
bind e setw synchronize-panes on
bind E setw synchronize-panes off

# set first window to index 1 (not 0) to map more to the keyboard layout...
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Setup 'v' to begin selection as in Vim
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# Screen like binding
unbind C-b
set -g prefix C-a
bind a send-prefix

# Enable mouse support (pane-aware selection, scroll, resize)
set -g mouse on

# No escape time for vi mode
set -sg escape-time 0

# Screen like binding for last window
unbind l
bind C-a last-window

# Bigger history
set -g history-limit 10000

# New windows/pane in $PWD
bind c new-window -c "#{pane_current_path}"

# Fix key bindings broken in tmux 2.1
set -g assume-paste-time 0

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Basic status bar colors
set -g status-bg "#181616"
set -g status-fg "#c5c9c5"

set-option -g status-left ""
set-option -g status-right "#[fg=#c4746e,bg=default]#[fg=#181616,bg=#c4746e,bold] #S #[fg=#c5c9c5,bg=#282727] %a %d %b %H:%M #[fg=#282727,bg=default]#[none]"

set -g status 2
set -g status-format[1] ""
set-option -g status-position top

# On-screen time for display-panes in ms.
set-option -g display-time 2000

# Default status bar colours.
set -g status-style fg="#c5c9c5",bg="#181616"

# Pane borders
set -g pane-border-style fg="#282727"
set -g pane-active-border-style fg="#8ba4b0"

# Window format styling (Catppuccin rounded style but Kanagawa Dragon colors)
set-option -g window-status-separator "  "

set -g window-status-format "#[fg=#282727,bg=default]#[fg=#a292a3,bg=#282727] #I #[fg=#282727,bg=#393836]#[fg=#c5c9c5,bg=#393836] #W #[fg=#393836,bg=default]#[none]"
set -g window-status-current-format "#[fg=#a292a3,bg=default]#[fg=#181616,bg=#a292a3,bold] #I #[fg=#a292a3,bg=#393836]#[fg=#c5c9c5,bg=#393836,bold] #W #[fg=#393836,bg=default]#[none]"

bind-key "T" display-popup -E -w 80% -h 70% -d '#{pane_current_path}' -T 'Sesh' tv sesh

set-option -g renumber-windows on
